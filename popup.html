<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meeting Cost Calculator</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        font-family: "Google Sans", Roboto, Arial, sans-serif;
        font-size: 14px;
        color: #3c4043;
        background: #fff;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid #e0e0e0;
      }

      .header-icon {
        width: 28px;
        height: 28px;
        background: #1a73e8;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: bold;
        font-size: 16px;
        flex-shrink: 0;
      }

      h2 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        color: #1a73e8;
      }

      label {
        display: block;
        font-weight: 500;
        margin-bottom: 4px;
        font-size: 13px;
        color: #3c4043;
      }

      .input-wrapper {
        display: flex;
        align-items: center;
        border: 1px solid #dadce0;
        border-radius: 4px;
        overflow: hidden;
        transition: border-color 0.15s;
      }

      .input-wrapper:focus-within {
        border-color: #1a73e8;
        box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.15);
      }

      .input-prefix {
        padding: 8px 8px 8px 10px;
        color: #5f6368;
        font-size: 14px;
        background: #f8f9fa;
        border-right: 1px solid #dadce0;
      }

      input[type="number"] {
        flex: 1;
        border: none;
        outline: none;
        padding: 8px 10px;
        font-size: 14px;
        font-family: inherit;
        color: #3c4043;
        background: transparent;
        -moz-appearance: textfield;
      }

      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        opacity: 1;
      }

      .hint {
        font-size: 11px;
        color: #5f6368;
        margin-top: 5px;
        line-height: 1.4;
      }

      button {
        display: block;
        width: 100%;
        margin-top: 14px;
        padding: 9px;
        background: #1a73e8;
        color: #fff;
        border: none;
        border-radius: 4px;
        font-size: 13px;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.15s;
      }

      button:hover {
        background: #1557b0;
      }

      button:active {
        background: #0f40a0;
      }

      #status {
        margin-top: 8px;
        font-size: 12px;
        text-align: center;
        min-height: 18px;
        color: #1e8e3e;
      }

      #status.error {
        color: #d93025;
      }

      .footer {
        margin-top: 14px;
        padding-top: 10px;
        border-top: 1px solid #e0e0e0;
        font-size: 11px;
        color: #5f6368;
        text-align: center;
      }

      .footer a {
        color: #1a73e8;
        text-decoration: none;
      }

      .footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-icon">$</div>
      <h2>Meeting Cost Calculator</h2>
    </div>

    <label for="cost-input">Cost per person per hour</label>
    <div class="input-wrapper">
      <span class="input-prefix" id="currency-prefix">$</span>
      <input
        type="number"
        id="cost-input"
        min="1"
        max="100000"
        step="1"
        placeholder="50"
        aria-label="Cost per person per hour in USD"
      />
    </div>
    <p class="hint">
      Used to calculate the total cost of a meeting based on the number of
      participants and its duration.
    </p>

    <button id="save-btn">Save</button>
    <div id="status" role="status" aria-live="polite"></div>

    <div class="footer">
      <a href="#" id="options-link">More settings</a>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
